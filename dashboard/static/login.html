<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>EDITH • Remote Access</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #0B0D12;
      --card:   rgba(11,22,37,0.88);
      --border: rgba(165,180,252,0.16);
      --accent: #A5B4FC;
      --adim:   rgba(165,180,252,0.13);
      --text:   #F1F3F9;
      --muted:  #7F899B;
    }
    html, body {
      height: 100%;
      background: radial-gradient(850px 620px at 50% 5%, rgba(79,91,160,0.18), transparent 64%), var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 340px;
      padding: 46px 36px;
      background: linear-gradient(145deg, rgba(24,28,43,0.96), rgba(13,15,23,0.98));
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.38), inset 0 1px 0 rgba(255,255,255,0.035);
      backdrop-filter: blur(22px);
      text-align: center;
    }
    .logo {
      font-size: 26px;
      font-weight: 750;
      letter-spacing: 3px;
      margin-bottom: 7px;
      text-shadow: 0 0 28px rgba(165,180,252,0.18);
    }
    .logo em { color: var(--accent); font-style: normal; }
    .sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 28px;
    }
    .key-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    .key-input {
      width: 100%;
      padding: 18px 14px;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-size: 30px;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      text-align: center;
      letter-spacing: 10px;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
      caret-color: var(--accent);
    }
    .key-input::placeholder {
      color: rgba(94,106,126,0.5);
      letter-spacing: 6px;
      font-size: 20px;
    }
    .key-input:focus {
      border-color: var(--accent);
      background: var(--adim);
      box-shadow: 0 0 0 3px rgba(165,180,252,0.12);
    }
    .err {
      font-size: 12px;
      color: #f87171;
      min-height: 18px;
      margin-bottom: 14px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #A5B4FC, #4DA8D8);
      color: #03101A;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover  { opacity: 0.88; }
    .btn:active { transform: scale(0.98); }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-7px); }
      40%,80% { transform: translateX(7px); }
    }
    .shake { animation: shake 0.35s ease; }
    .voice-note {
      font-size: 10px;
      color: var(--muted);
      margin-top: 20px;
      line-height: 1.6;
      text-align: left;
    }
    .voice-note code {
      background: rgba(255,255,255,0.07);
      padding: 1px 4px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 9px;
    }
    #reconnecting {
      display: none;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 16px;
    }


    /* Apple-inspired grouped surfaces shared with the native desktop. */
    :root {--bg:#f2f2f7;--surface:#fff;--border:#d8d8e1;--accent:#007aff;
      --adim:#e5f0ff;--text:#1c1c1e;--muted:#686872;--green:#238446;--gdim:#e4f4e9;}
    html,body {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:var(--bg);color:var(--text);font-size:15px;}
    header {background:#ffffffed;padding:18px 24px;box-shadow:none;backdrop-filter:blur(16px);}
    .logo {letter-spacing:.5px;font-size:19px;font-weight:700;}
    .pill,.enc-badge,.url {letter-spacing:0;font-size:12px;}
    .workspace-label {font-size:12px;color:var(--muted);border-left:1px solid var(--border);padding-left:14px;}
    main {max-width:1000px;padding:28px 24px;gap:18px;scroll-behavior:smooth;}
    .msg {box-shadow:none;border-radius:18px;padding:16px 20px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;}
    .msg-j {background:#fff;border-color:var(--border);}
    .msg-u {background:#e5f0ff;border-color:#c2dcff;}
    .lbl,.fc-lbl {font-size:12px;letter-spacing:0;opacity:1;font-weight:600;}
    .msg-sys {font-size:13px;line-height:1.6;max-width:100%;}
    .welcome {margin:auto 0;padding:36px 12px;color:var(--muted);line-height:1.8;}
    .welcome h1 {font-size:32px;color:var(--text);font-weight:700;letter-spacing:-1px;margin-bottom:10px;}
    footer {background:#ffffffed;gap:10px;padding:16px max(20px,calc((100vw - 1000px)/2));
      padding-bottom:max(16px,env(safe-area-inset-bottom));box-shadow:none;backdrop-filter:blur(16px);}
    #inp {border-radius:16px;background:#f2f2f7;min-height:46px;font:inherit;padding:12px 14px;}
    .btn,.btn-attach,#mic-btn {font:inherit;letter-spacing:0;font-weight:600;border-radius:14px;
      min-height:46px;min-width:46px;padding:11px 15px;box-shadow:none;display:flex;align-items:center;justify-content:center;gap:6px;}
    .btn-send {background:var(--accent);color:#fff;}
    .btn:disabled,#mic-btn:disabled {opacity:.5;cursor:wait;transform:none;}
    button:focus-visible,input:focus-visible,a:focus-visible {outline:2px solid var(--accent);outline-offset:4px;}
    .btn-attach {color:var(--accent);}
    .ui-symbol {width:18px;height:18px;flex-shrink:0;}
    #toast {border-radius:16px;white-space:normal;max-width:calc(100vw - 32px);z-index:20;font-size:14px;letter-spacing:0;background:#e4f4e9;color:#176735;border-color:#b5d9bf;}
    .msg-file {border-radius:18px;box-shadow:none;max-width:95%;}
    .fc-name {font-size:14px;} .fc-size,.fc-status,.fc-dl {font-size:12px;letter-spacing:0;}
    .card {background:var(--surface);border:1px solid var(--border);box-shadow:0 16px 60px #1212300c;
      border-radius:28px;padding:36px;max-width:440px;width:calc(100% - 32px);}
    .card .logo {font-size:26px;letter-spacing:1px;}
    .sub {font-size:18px;letter-spacing:0;text-transform:none;margin-top:8px;}
    .hint,.voice-note {color:var(--muted);font-size:14px;line-height:1.7;}
    .field-label {display:block;text-align:left;font-size:14px;margin:24px 0 10px;}
    .key-input {border-radius:16px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:28px;min-height:58px;}
    .err {color:#c93434;font-size:14px;line-height:1.6;min-height:24px;}
    .voice-note {padding:14px;background:var(--bg);border-radius:16px;}
    .card .btn {width:100%;background:var(--accent);color:#fff;}
    #voice-setup {background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;line-height:1.7;}
    @media(max-width:600px) {
      header {padding:14px;flex-wrap:wrap;gap:10px;} .workspace-label,.enc-badge {display:none!important;}
      main {padding:20px 14px;} .welcome h1 {font-size:28px;}
      footer {padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom));}
      .msg {max-width:96%;padding:13px 15px;} .card {padding:28px 24px;}
    }
    @media(prefers-reduced-motion:reduce) {
      *,*::before,*::after {animation:none!important;transition:none!important;scroll-behavior:auto!important;}
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="logo">EDITH</div>
    <div class="sub">Remote Access</div>
    <p id="reconnecting">Reconnecting…</p>
    <p class="hint">Press <strong style="color:var(--text)">Remote Control</strong> in the desktop app to get a QR code or session key.</p>
    <label for="key" class="field-label">Access code</label>
    <div class="key-wrap">
      <input class="key-input" id="key" type="text" maxlength="6"
             autocomplete="off" autocorrect="off" spellcheck="false"
             placeholder="· · · · · ·">
    </div>
    <div class="err" id="err" role="alert" aria-live="assertive"></div>
    <button class="btn" id="connect-btn" onclick="doLogin()">Connect to workspace</button>
    <p class="voice-note">For voice input, use your desktop's HTTPS address and allow microphone access. Text commands and files are also available.</p>
  </div>

  <script>
    // Try auto-reconnect with stored device token (set on first QR login)
    (async function() {
      const devTok = localStorage.getItem('jarvis_device_token');
      if (!devTok) return;
      document.getElementById('reconnecting').style.display = 'block';
      try {
        const r = await fetch('/api/device-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_token: devTok }),
        });
        if (r.status === 401 || r.status === 403) {
          // Only explicit rejection invalidates pairing. An offline phone,
          // timeout or temporary server error must never destroy saved pairing.
          localStorage.removeItem('jarvis_device_token');
          document.getElementById('err').textContent = 'Pairing expired — enter a new access code.';
        } else if (r.ok) {
          const d = await r.json();
          if (d.ok && d.token) {
            sessionStorage.setItem('jarvis_key', d.key);
            sessionStorage.setItem('jarvis_token', d.token);
            location.replace('/');
            return;
          }
        } else {
          document.getElementById('err').textContent =
            'Connection unavailable — pairing saved. Retry when the network returns.';
        }
      } catch (_) {
        document.getElementById('err').textContent =
          'Offline — saved pairing kept. Retry when the network returns.';
      }
      document.getElementById('reconnecting').style.display = 'none';
    })();

    const inp = document.getElementById('key');
    inp.focus();

    inp.addEventListener('input', () => {
      inp.value = inp.value.toUpperCase().replace(/[^A-Z2-9]/g, '');
      if (inp.value.length === 6) doLogin();
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    let loginPending = false;
    async function doLogin() {
      if (loginPending) return;
      const key = inp.value.trim();
      if (key.length < 6) { shake(); return; }
      loginPending = true;
      const button = document.getElementById('connect-btn');
      button.disabled = true;
      button.textContent = 'Connecting…';
      let data;
      try {
        const r = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: key })
        });
        data = await r.json();
      } catch (e) {
        document.getElementById('err').textContent = 'Connection error';
        shake(); return;
      } finally {
        loginPending = false;
        button.disabled = false;
        button.textContent = 'Connect to workspace';
      }
      if (data.ok && data.token) {
        sessionStorage.setItem('jarvis_key', key);
        sessionStorage.setItem('jarvis_token', data.token);
        location.href = '/';
      } else {
        inp.value = '';
        inp.focus();
        document.getElementById('err').textContent = 'Invalid or expired key';
        shake();
      }
    }

    function shake() {
      const c = document.getElementById('card');
      c.classList.remove('shake');
      void c.offsetWidth;
      c.classList.add('shake');
    }
  </script>
</body>
</html>
