name: Quality checks

on:
  push:
    branches: [ui/edith-interface]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install lightweight unit-test dependencies
        run: python -m pip install pillow requests
      - name: Compile all Python modules
        run: python -m compileall -q main.py ui.py setup.py actions core dashboard memory plugins tests config
      - name: Run product contract tests
        run: python -m unittest discover -s tests -v
      - name: Check inline dashboard JavaScript
        run: python tests/check_inline_js.py
